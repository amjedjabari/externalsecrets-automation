---
apiVersion: policy.open-cluster-management.io/v1
kind: PolicyGenerator
metadata:
  name: gen-policy-generator-eso
policyDefaults:
  namespace: acm-install-policies
  remediationAction: enforce
  consolidateManifests: false
  policySets:
    - install-eso
placementBindingDefaults:
  name: "eso-binding"

policies:
  # Logging Policies - start
  - name: install-eso 
    manifests:
      - path: config/policy-install-eso.yaml
  # Logging Policies - e
  # ESO Instance policy - start
  - name: external-secrets-operator-instance
    manifests:
      - path: external-secrets-operator/instance/policy-instance.yaml
  - name: externalsecrets
    manifests:
      - path: externalsecrets/policy-externalsecret-app.yaml
      - path: externalsecrets/policy-externalsecret-db.yaml
      - path: externalsecrets/policy-secretstore-app.yaml
      - path: externalsecrets/policy-secretstore-db.yaml
  # ESO Instance policy - end

policySets:
  - name: install-eso
    placement:
      placementPath: placements/all-placement.yaml
